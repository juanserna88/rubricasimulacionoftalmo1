document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 uppercase; color: #6b7a85\">\n        URL del Google Apps Script (Web App)\n        <input type=\"url\" value=\"{{ cfgUrl }}\" sc-camel-on-change=\"{{ setUrl }}\" placeholder=\"https://script.google.com/macros/s/.../exec\" style=\"font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #14212b; padding: 9px 10px; border: 1px solid #cfd6db; border-radius: 3px; background: #fbfcfc\">\n      <\u002Flabel>\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #6b7a85\">\n        Copia al correo del evaluador\n        <input type=\"email\" value=\"{{ cfgEmail }}\" sc-camel-on-change=\"{{ setEmail }}\" placeholder=\"evaluador@umanizales.edu.co\" style=\"font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #14212b; padding: 9px 10px; border: 1px solid #cfd6db; border-radius: 3px; background: #fbfcfc\">\n      <\u002Flabel>\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #6b7a85\">\n        ID de la Google Sheet (Matriz de Notas)\n        <input type=\"text\" value=\"{{ cfgSheet }}\" sc-camel-on-change=\"{{ setSheet }}\" placeholder=\"1AbC...xyz\" style=\"font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #14212b; padding: 9px 10px; border: 1px solid #cfd6db; border-radius: 3px; background: #fbfcfc\">\n      <\u002Flabel>\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #6b7a85\">\n        Correo del estudiante (destinatario)\n        <input type=\"email\" value=\"{{ studentEmail }}\" sc-camel-on-change=\"{{ setStudentEmail }}\" placeholder=\"estudiante@umanizales.edu.co\" style=\"font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #14212b; padding: 9px 10px; border: 1px solid #cfd6db; border-radius: 3px; background: #fbfcfc\">\n      <\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 18px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ send }}\" style=\"border: 0; cursor: pointer; background: #0f6e5c; color: #fff; font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 11px 20px; border-radius: 3px\" style-hover=\"background: #0a4c40\">Enviar resultado por email<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ toPdf }}\" style=\"cursor: pointer; background: #fff; color: #14212b; border: 1px solid #14212b; font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 11px 20px; border-radius: 3px\" style-hover=\"background: #14212b; color: #fff\">Descargar PDF<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"cursor: pointer; background: transparent; color: #6b7a85; border: 0; font-size: 13px; text-decoration: underline\">Limpiar puntajes<\u002Fbutton>\n      <div style=\"font-size: 13px; color: #6b7a85; margin-left: auto\">{{ statusMsg }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sheet\" style=\"width: 100%; max-width: 900px; background: #fff; box-shadow: 0 1px 3px rgba(20,33,43,.18)\">\n\n    <div style=\"background: #14212b; padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px\">\n      <img src=\"a8ee01a0-5e64-455b-8e41-d0dd3b1339d3\" alt=\"Universidad de Manizales\" style=\"height: 46px; width: auto; display: block\">\n      <img src=\"657d0656-2301-49b4-9ced-55c45fb703d1\" alt=\"Acreditación institucional de alta calidad\" style=\"height: 34px; width: auto; display: block\">\n    <\u002Fdiv>\n\n    <div style=\"padding: 26px 28px 8px; border-bottom: 3px solid #0f6e5c\">\n      <div style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; line-height: 1.05\">Rúbrica de evaluación<\u002Fdiv>\n      <div style=\"font-size: 15px; color: #46565f; margin-top: 6px; padding-bottom: 18px\">Rotación de Semiología — Órganos de los Sentidos, Cabeza y Cuello<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: 22px 28px 0\">\n      <div style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #0f6e5c; margin-bottom: 12px\">Datos del estudiante<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 2fr 1fr; gap: 14px\">\n        <label style=\"display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #6b7a85\">\n          Nombre del estudiante\n          <input type=\"text\" value=\"{{ student }}\" sc-camel-on-change=\"{{ setStudent }}\" placeholder=\"Apellidos y nombres\" style=\"font-size: 15px; font-weight: 500; letter-spacing: 0; text-transform: none; color: #14212b; padding: 8px 0; border: 0; border-bottom: 1px solid #b9c2c8; background: transparent\">\n        <\u002Flabel>\n\n        <label style=\"display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #6b7a85\">\n          Fecha de evaluación\n          <input type=\"date\" value=\"{{ date }}\" sc-camel-on-change=\"{{ setDate }}\" style=\"font-size: 15px; font-weight: 500; letter-spacing: 0; color: #14212b; padding: 8px 0; border: 0; border-bottom: 1px solid #b9c2c8; background: transparent\">\n        <\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: 26px 28px 0\">\n      <div style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #0f6e5c; margin-bottom: 10px\">Componentes de evaluación<\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: minmax(0,1fr) 132px 108px minmax(0,190px); gap: 0; align-items: stretch; border-top: 2px solid #14212b\">\n        <div style=\"font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #6b7a85; padding: 9px 10px 9px 0\">Componente<\u002Fdiv>\n        <div style=\"font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #6b7a85; padding: 9px 10px; text-align: center\">Cumple<\u002Fdiv>\n        <div style=\"font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #6b7a85; padding: 9px 10px; text-align: center\">Puntaje<\u002Fdiv>\n        <div style=\"font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #6b7a85; padding: 9px 0 9px 10px\">Observaciones<\u002Fdiv>\n\n        <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"12\">\n          <div style=\"grid-column: 1 / -1; border-top: 1px solid #e2e7ea\"><\u002Fdiv>\n          <sc-if value=\"{{ row.isGroup }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"grid-column: 1 / -1; background: #f4f6f7; padding: 10px 12px; font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #14212b\">{{ row.label }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ row.isItem }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding: 11px 10px 11px 0; font-size: 15px; line-height: 1.35; align-self: center\">{{ row.label }}<\u002Fdiv>\n            <div style=\"padding: 8px 10px; display: flex; gap: 6px; justify-content: center; align-self: center\">\n              <button type=\"button\" sc-camel-on-click=\"{{ row.setYes }}\" style=\"cursor: pointer; min-width: 54px; padding: 7px 0; border-radius: 3px; font-size: 13px; font-weight: 600; letter-spacing: .04em; border: 1px solid {{ row.yesBorder }}; background: {{ row.yesBg }}; color: {{ row.yesFg }}\">Sí<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ row.setNo }}\" style=\"cursor: pointer; min-width: 54px; padding: 7px 0; border-radius: 3px; font-size: 13px; font-weight: 600; letter-spacing: .04em; border: 1px solid {{ row.noBorder }}; background: {{ row.noBg }}; color: {{ row.noFg }}\">No<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"padding: 8px 10px; text-align: center; align-self: center; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: #14212b\">{{ row.score }}<\u002Fdiv>\n            <div style=\"padding: 8px 0 8px 10px; align-self: center\">\n              <input type=\"text\" value=\"{{ row.note }}\" sc-camel-on-change=\"{{ row.setNote }}\" placeholder=\"{{ row.hint }}\" style=\"width: 100%; box-sizing: border-box; font-size: 13px; color: #14212b; padding: 6px 8px; border: 1px solid #dde2e5; border-radius: 3px; background: #fbfcfc\">\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ row.isSubtotal }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding: 10px 10px 10px 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #46565f\">{{ row.label }}<\u002Fdiv>\n            <div style=\"padding: 10px; font-size: 12px; color: #6b7a85; text-align: center; align-self: center\">{{ row.max }}<\u002Fdiv>\n            <div style=\"padding: 10px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: #0f6e5c\">{{ row.score }}<\u002Fdiv>\n            <div><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-for>\n        <div style=\"grid-column: 1 / -1; border-top: 2px solid #14212b\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: 22px 28px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px\">\n      <div style=\"border: 1px solid #d5dbdf; padding: 16px 18px\">\n        <div style=\"font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #6b7a85\">Puntaje total<\u002Fdiv>\n        <div style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.05; margin-top: 4px\">{{ total }}<span style=\"font-size: 20px; color: #6b7a85\"> / 40<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #0f6e5c; color: #fff; padding: 16px 18px\">\n        <div style=\"font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; opacity: .8\">Nota final (0 – 5)<\u002Fdiv>\n        <div style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.05; margin-top: 4px\">{{ nota }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: 22px 28px 0\">\n      <label style=\"display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #6b7a85\">\n        Retroalimentación general\n        <textarea rows=\"3\" value=\"{{ feedback }}\" sc-camel-on-change=\"{{ setFeedback }}\" placeholder=\"Fortalezas y aspectos por mejorar\" style=\"font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #14212b; padding: 9px 10px; border: 1px solid #dde2e5; border-radius: 3px; background: #fbfcfc; resize: vertical\"><\u002Ftextarea>\n      <\u002Flabel>\n    <\u002Fdiv>\n\n    <div style=\"padding: 22px 28px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 24px\">\n      <div>\n        <div style=\"border-bottom: 1px solid #14212b; height: 40px\"><\u002Fdiv>\n        <div style=\"font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: #6b7a85; margin-top: 6px\">Firma del evaluador<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"border-bottom: 1px solid #14212b; height: 40px\"><\u002Fdiv>\n        <div style=\"font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: #6b7a85; margin-top: 6px\">Firma del estudiante<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"padding: 24px 28px 26px; margin-top: 24px; background: #f4f6f7; border-top: 1px solid #e2e7ea\">\n      <div style=\"font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #6b7a85; margin-bottom: 8px\">Instrucciones de llenado<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 5px; font-size: 13px; line-height: 1.5; color: #46565f\">\n        <div>1. Marque <strong>Sí<\u002Fstrong> (5 puntos) cuando el estudiante cumple el criterio; <strong>No<\u002Fstrong> otorga 0 puntos.<\u002Fdiv>\n        <div>2. En 1.1 marque Sí únicamente si preguntó los cuatro componentes del dolor (localización, tipo, intensidad, irradiación).<\u002Fdiv>\n        <div>3. La nota final se calcula automáticamente sobre 40 puntos y se convierte a escala 0 – 5.<\u002Fdiv>\n        <div>4. Al enviar, el resultado se registra en la Matriz de Notas y se envía copia al correo del evaluador.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:980,&quot;height&quot;:1400}}\">\nconst CRITERIA = [\n  { group: \"1. Anamnesis\", max: 20, items: [\n    { id: \"1.1\", label: \"1.1 Dolor — componentes (localización, tipo, intensidad, irradiación)\", hint: \"5 si preguntó los 4, si no 0\" },\n    { id: \"1.2\", label: \"1.2 Síntomas concomitantes\", hint: \"Sí: 5 / No: 0\" },\n    { id: \"1.3\", label: \"1.3 Factores calmantes\", hint: \"Sí: 5 / No: 0\" },\n    { id: \"1.4\", label: \"1.4 Factores agravantes\", hint: \"Sí: 5 / No: 0\" }\n  ]},\n  { group: \"2. Examen físico — oftalmoscopia\", max: 15, items: [\n    { id: \"2.1\", label: \"2.1 Verifica anexos\", hint: \"Sí: 5 / No: 0\" },\n    { id: \"2.2\", label: \"2.2 Verifica rojo retiniano\", hint: \"Sí: 5 / No: 0\" },\n    { id: \"2.3\", label: \"2.3 Posición correcta (OD→OD, OI→OI)\", hint: \"Sí: 5 / No: 0 (sin cruzar)\" }\n  ]},\n  { group: \"3. Impresión diagnóstica\", max: 5, items: [\n    { id: \"3.1\", label: \"3.1 Formuló impresión diagnóstica\", hint: \"Sí: 5 / No: 0\" }\n  ]}\n];\nconst CFG_KEY = \"rubrica_sim_cfg_v4\";\nconst DEFAULT_EVAL_EMAIL = \"juanserna8888@gmail.com\";\nconst DEFAULT_SHEET_ID = \"10c8tFjj23JM-lp5V2v6ohRrx6Qe4ffHA2eSlsJE-RzU\";\nconst DEFAULT_URL = \"https://script.google.com/macros/s/AKfycbxL5yYmgK0G68-GDLlc7sMGHmyXyrwz1sSIY4kJpp-w50vcUn4af_u9PNpyThnrfQY/exec\";\n\nclass Component extends DCLogic {\n  state = {\n    cfg: { url: DEFAULT_URL, email: DEFAULT_EVAL_EMAIL, sheetId: DEFAULT_SHEET_ID },\n    student: \"\",\n    studentEmail: \"\",\n    date: new Date().toISOString().slice(0, 10),\n    scores: {},\n    notes: {},\n    feedback: \"\",\n    status: \"\"\n  };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(CFG_KEY);\n      if (raw) {\n        var saved = JSON.parse(raw);\n        this.setState({ cfg: Object.assign({}, saved, {\n          url: saved.url || DEFAULT_URL,\n          email: saved.email || DEFAULT_EVAL_EMAIL,\n          sheetId: saved.sheetId || DEFAULT_SHEET_ID\n        }) });\n      }\n    } catch (e) {}\n  }\n\n  saveCfg(patch) {\n    const cfg = Object.assign({}, this.state.cfg, patch);\n    this.setState({ cfg });\n    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}\n  }\n\n  totals() {\n    const s = this.state.scores;\n    const groups = CRITERIA.map(g => ({\n      max: g.max,\n      score: g.items.reduce((a, it) => a + (s[it.id] === 5 ? 5 : 0), 0)\n    }));\n    const total = groups.reduce((a, g) => a + g.score, 0);\n    return { groups, total, nota: total / 40 * 5 };\n  }\n\n  async send() {\n    const { cfg } = this.state;\n    if (!cfg.url) { this.setState({ status: \"Falta la URL del Apps Script.\" }); return; }\n    if (!this.state.student.trim()) { this.setState({ status: \"Ingrese el nombre del estudiante.\" }); return; }\n    const t = this.totals();\n    const payload = {\n      sheetId: cfg.sheetId,\n      evaluatorEmail: cfg.email,\n      student: this.state.student,\n      studentEmail: this.state.studentEmail,\n      date: this.state.date,\n      rotacion: \"Semiología — Órganos de los Sentidos, Cabeza y Cuello\",\n      total: t.total,\n      nota: Number(t.nota.toFixed(2)),\n      feedback: this.state.feedback,\n      criterios: CRITERIA.flatMap(g => g.items.map(it => ({\n        id: it.id, componente: it.label, grupo: g.group,\n        puntaje: this.state.scores[it.id] === 5 ? 5 : 0,\n        observacion: this.state.notes[it.id] || \"\"\n      })))\n    };\n    this.setState({ status: \"Enviando…\" });\n    try {\n      await fetch(cfg.url, {\n        method: \"POST\",\n        mode: \"no-cors\",\n        headers: { \"Content-Type\": \"text/plain;charset=utf-8\" },\n        body: JSON.stringify(payload)\n      });\n      this.setState({ status: \"Enviado a la Matriz de Notas.\" });\n    } catch (e) {\n      this.setState({ status: \"Error al enviar: \" + e.message });\n    }\n  }\n\n  renderVals() {\n    const t = this.totals();\n    const rows = [];\n    CRITERIA.forEach((g, gi) => {\n      rows.push({ isGroup: true, isItem: false, isSubtotal: false, label: g.group });\n      g.items.forEach(it => {\n        const on = this.state.scores[it.id] === 5;\n        const off = this.state.scores[it.id] === 0;\n        rows.push({\n          isGroup: false, isItem: true, isSubtotal: false,\n          label: it.label, hint: it.hint,\n          score: on ? \"5.0\" : off ? \"0.0\" : \"—\",\n          note: this.state.notes[it.id] || \"\",\n          yesBg: on ? \"#0f6e5c\" : \"#fff\", yesFg: on ? \"#fff\" : \"#46565f\", yesBorder: on ? \"#0f6e5c\" : \"#cfd6db\",\n          noBg: off ? \"#14212b\" : \"#fff\", noFg: off ? \"#fff\" : \"#46565f\", noBorder: off ? \"#14212b\" : \"#cfd6db\",\n          setYes: () => this.setState(s => ({ scores: Object.assign({}, s.scores, { [it.id]: 5 }), status: \"\" })),\n          setNo: () => this.setState(s => ({ scores: Object.assign({}, s.scores, { [it.id]: 0 }), status: \"\" })),\n          setNote: e => { const v = e.target.value; this.setState(s => ({ notes: Object.assign({}, s.notes, { [it.id]: v }) })); }\n        });\n      });\n      rows.push({\n        isGroup: false, isItem: false, isSubtotal: true,\n        label: \"Subtotal \" + g.group.replace(/^\\d+\\.\\s*/, \"\"),\n        max: \"Máx. \" + g.max + \" pts\",\n        score: String(t.groups[gi].score)\n      });\n    });\n\n    return {\n      rows,\n      total: String(t.total),\n      nota: t.nota.toFixed(2),\n      student: this.state.student,\n      studentEmail: this.state.studentEmail,\n      date: this.state.date,\n      feedback: this.state.feedback,\n      statusMsg: this.state.status,\n      cfgUrl: this.state.cfg.url,\n      cfgEmail: this.state.cfg.email,\n      cfgSheet: this.state.cfg.sheetId,\n      setStudent: e => this.setState({ student: e.target.value }),\n      setStudentEmail: e => this.setState({ studentEmail: e.target.value.trim() }),\n      setDate: e => this.setState({ date: e.target.value }),\n      setFeedback: e => this.setState({ feedback: e.target.value }),\n      setUrl: e => this.saveCfg({ url: e.target.value.trim() }),\n      setEmail: e => this.saveCfg({ email: e.target.value.trim() }),\n      setSheet: e => this.saveCfg({ sheetId: e.target.value.trim() }),\n      send: () => this.send(),\n      toPdf: () => window.print(),\n      reset: () => this.setState({ scores: {}, notes: {}, feedback: \"\", status: \"\" })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
